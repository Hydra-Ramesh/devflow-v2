services:
  # Infrastructure
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - devflow-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - devflow-net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
    networks:
      - devflow-net

  mongodb:
    image: mongo:6
    networks:
      - devflow-net

  redis:
    image: redis:7-alpine
    networks:
      - devflow-net

  qdrant:
    image: qdrant/qdrant:v1.7.0
    networks:
      - devflow-net

  gateway-service:
    image: devflow-v2/gateway-service
    restart: unless-stopped
    env_file:
      - path: ./services/gateway-service/.env
        required: false
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:5001
      USER_SERVICE_URL: http://user-service:5002
      AUDIT_SERVICE_URL: http://audit-service:5022
      REALTIME_SERVICE_URL: http://realtime-service:5023
      QUESTION_SERVICE_URL: http://question-service:5005
      ANSWER_SERVICE_URL: http://answer-service:5006
      VOTE_SERVICE_URL: http://vote-service:5007
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - devflow-net
    depends_on:
      - redis
      - auth-service
      - user-service
      - audit-service
      - realtime-service
      - question-service
      - answer-service
      - vote-service

  auth-service:
    image: devflow-v2/auth-service
    restart: unless-stopped
    env_file:
      - path: ./services/auth-service/.env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-supersecretkeythatisverylongandsecurebecausejwtneedsit}
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    networks:
      - devflow-net
    depends_on:
      - kafka
      - redis
      - postgres

  user-service:
    image: devflow-v2/user-service
    restart: unless-stopped
    env_file:
      - path: ./services/user-service/.env
        required: false
    environment:
      SERVER_PORT: 5002
      DATABASE_URL: jdbc:postgresql://postgres:5432/postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-supersecretkeythatisverylongandsecurebecausejwtneedsit}
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    networks:
      - devflow-net
    depends_on:
      - kafka
      - redis
      - postgres

  audit-service:
    image: devflow-v2/audit-service
    restart: unless-stopped
    env_file:
      - path: ./services/audit-service/.env
        required: false
    environment:
      PORT: 5022
      MONGO_URI: mongodb://mongodb:27017/audit-service
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-supersecretkeythatisverylongandsecurebecausejwtneedsit}
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    ports:
      - "5022:5022"
    networks:
      - devflow-net
    depends_on:
      - kafka
      - mongodb

  realtime-service:
    image: devflow-v2/realtime-service
    restart: unless-stopped
    env_file:
      - path: ./services/realtime-service/.env
        required: false
    environment:
      PORT: 5023
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-supersecretkeythatisverylongandsecurebecausejwtneedsit}
    build:
      context: ./services/realtime-service
      dockerfile: Dockerfile
    ports:
      - "5023:5023"
    networks:
      - devflow-net
    depends_on:
      - kafka
      - redis

  question-service:
    image: devflow-v2/question-service
    restart: unless-stopped
    env_file:
      - path: ./services/question-service/.env
        required: false
    environment:
      PORT: 5005
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/question_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-supersecretkeythatisverylongandsecurebecausejwtneedsit}
    build:
      context: ./services/question-service
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    networks:
      - devflow-net
    depends_on:
      - kafka
      - postgres

  answer-service:
    image: devflow-v2/answer-service
    restart: unless-stopped
    env_file:
      - path: ./services/answer-service/.env
        required: false
    environment:
      PORT: 5006
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/answer_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-supersecretkeythatisverylongandsecurebecausejwtneedsit}
    build:
      context: ./services/answer-service
      dockerfile: Dockerfile
    ports:
      - "5006:5006"
    networks:
      - devflow-net
    depends_on:
      - kafka
      - redis
      - postgres

  vote-service:
    image: devflow-v2/vote-service
    restart: unless-stopped
    env_file:
      - path: ./services/vote-service/.env
        required: false
    environment:
      PORT: 5007
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/vote_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-supersecretkeythatisverylongandsecurebecausejwtneedsit}
    build:
      context: ./services/vote-service
      dockerfile: Dockerfile
    ports:
      - "5007:5007"
    networks:
      - devflow-net
    depends_on:
      - kafka
      - redis
      - postgres

networks:
  devflow-net:
    driver: bridge