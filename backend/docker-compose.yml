services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: devflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
    - "2181:2181"
  
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: devflow-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
    - "9092:9092"
  
  postgres:
    image: postgres:15-alpine
    container_name: devflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
        - devflow-pg-data:/var/lib/postgresql/data
        - ./scripts/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh
    
  mongodb:
    image: mongo:6
    container_name: devflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - devflow-mongodb-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: devflow-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: devflow-qdrant
    ports:
      - "6333:6333"
    volumes:
      - devflow-qdrant-data:/qdrant/storage

volumes:
  devflow-pg-data:
  devflow-mongodb-data:
  devflow-qdrant-data:
