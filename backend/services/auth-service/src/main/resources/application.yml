server:
    port: ${SERVER_PORT}

app:
    frontend:
        url: ${FRONTEND_URL}

spring:
    config:
        import:
            - optional:file:.env[.properties]
            - optional:file:backend/services/auth-service/.env[.properties]
    application:
        name: auth-service

    datasource:
        url: ${DATABASE_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 10
            minimum-idle: 2
            idle-timeout: 600000
            max-lifetime: 600000
            connection-timeout: 30000

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID}
                        client-secret: ${GOOGLE_CLIENT_SECRET}
                        scope: profile, email
                    github:
                        client-id: ${GITHUB_CLIENT_ID}
                        client-secret: ${GITHUB_CLIENT_SECRET}
                        scope: user:email, read:user


    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}

    kafka:
        bootstrap-servers: ${KAFKA_BROKERS}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    jwt:
        secret: ${JWT_SECRET}
        expiration: ${JWT_EXPIRATION}

management:
    endpoints:
        web:
            exposure:
                include: health, prometheus
    endpoint:
        health:
            show-details: always

logging:
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [Trace: %X{correlationId}] - %msg%n"